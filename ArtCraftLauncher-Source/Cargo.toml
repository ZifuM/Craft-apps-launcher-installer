[package]
name = "artcraft-launcher"
version = "0.1.0"
edition = "2024"
description = "A native desktop hub for the ArtCraft creative apps"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
reqwest = { version = "0.12", features = ["blocking", "json", "native-tls"], default-features = false }
raw-window-handle = "0.6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "artcraft-launcher"
path = "src/main.rs"

[[bin]]
name = "artcraft-setup"
path = "src/bin/setup.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
