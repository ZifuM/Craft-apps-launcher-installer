name: Release downloads

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v3.5.0-beta.1)
        required: true
        type: string
      publish:
        description: Publish the draft after all platform downloads are attached
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-downloads-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - id: version
        name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('ArtCraftLauncher-Source/Cargo.toml').read_text())['package']['version']
          tag = os.environ['RELEASE_TAG']
          if tag not in (version, 'v' + version):
              raise SystemExit(f'Release tag must be {version} or v{version}, matching Cargo.toml')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
              output.write(f'prerelease={str("-" in version).lower()}\n')
          PY

  linux:
    needs: version
    uses: ./.github/workflows/linux-build.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
    secrets:
      ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET }}

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows x64 installer
        env:
          ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET }}
        shell: pwsh
        working-directory: ArtCraftLauncher-Source
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET)) { throw 'Google desktop configuration is missing from repository Actions secrets.' }
          cargo build --locked --release --bin artcraft-launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --bin artcraft-setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path ../dist/windows -Force | Out-Null
          Copy-Item -LiteralPath target/release/artcraft-setup.exe -Destination ../dist/windows/Windows-x86_64.exe
          Copy-Item -LiteralPath target/release/artcraft-launcher.exe -Destination ../dist/windows/ArtCraftMasterSuite.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ArtCraftMasterSuite-Windows-x64
          if-no-files-found: error
          path: |
            dist/windows/Windows-x86_64.exe
            dist/windows/ArtCraftMasterSuite.exe

  macos:
    needs: version
    uses: ./.github/workflows/macos-build.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
    secrets:
      ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET }}

  publish:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ArtCraftMasterSuite-*
          path: packages
      - name: Collect downloads and create release checksums
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, shutil
          source = pathlib.Path('packages')
          destination = pathlib.Path('release')
          destination.mkdir()
          names = ['Windows-x86_64.exe', 'macOS-universal.dmg'] + [
              f'Linux-{arch}.{suffix}'
              for arch in ('x86_64', 'aarch64') for suffix in ('AppImage', 'flatpak')
          ]
          sums = []
          for name in names:
              candidates = list(source.rglob(name))
              if len(candidates) != 1 or candidates[0].stat().st_size == 0:
                  raise SystemExit(f'Missing, empty or duplicate release download: {name}')
              target = destination / name
              shutil.copyfile(candidates[0], target)
              with target.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              sums.append(f'{digest}  {name}\n')
          (destination / 'SHA256SUMS.txt').write_text(''.join(sums))
          PY
      - name: Attach installable files to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          IS_PRERELEASE: ${{ needs.version.outputs.prerelease }}
          PUBLISH_RELEASE: ${{ inputs.publish || false }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
          fi
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
          echo "Windows EXE, macOS DMG and Linux AppImage/Flatpak downloads attached to release $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
