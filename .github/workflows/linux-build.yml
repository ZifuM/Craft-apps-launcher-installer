name: Linux packages
on:
  workflow_call:
    secrets:
      ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET:
        required: false
    inputs:
      ref:
        type: string
        required: true
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ArtCraftLauncher-Source/**'
      - 'packaging/linux/**'
      - '.github/workflows/linux-build.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libfuse2t64 patchelf desktop-file-utils flatpak flatpak-builder zsync poppler-utils
      - name: Build AppImage
        run: |
          test -n "$ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET" || { echo "Google desktop configuration is missing from repository Actions secrets." >&2; exit 1; }
          bash packaging/linux/build-appimage.sh
      - name: Prepare Flatpak SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.freedesktop.Sdk.Extension.rust-stable//24.08
      - name: Build Flatpak
        run: dbus-run-session -- bash packaging/linux/build-flatpak.sh
      - name: Combine release checksums
        run: cat dist/linux/*.sha256 > dist/linux/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ArtCraftMasterSuite-Linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/linux/*.AppImage
            dist/linux/*.flatpak
            dist/linux/SHA256SUMS.txt
