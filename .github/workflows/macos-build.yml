name: macOS package
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET:
        required: false
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    env:
      ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build universal Mac app and DMG
        run: |
          test -n "$ARTCRAFT_GOOGLE_DESKTOP_CLIENT_SECRET" || { echo "Google desktop configuration is missing from repository Actions secrets." >&2; exit 1; }
          bash packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ArtCraftMasterSuite-macOS-universal
          if-no-files-found: error
          path: |
            dist/macos/*.dmg
            dist/macos/*.sha256
